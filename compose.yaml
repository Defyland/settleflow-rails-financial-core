services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: settleflow
      POSTGRES_PASSWORD: settleflow
      POSTGRES_DB: settleflow_rails_financial_core_development
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settleflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://settleflow:settleflow@db:5432/settleflow_rails_financial_core_development
      CLICKHOUSE_URL: http://clickhouse:8123
      REDIS_URL: redis://redis:6379/0
      SETTLEFLOW_DEMO_API_KEY: settleflow_dev_key_change_me
      RAILS_LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./bin/rails", "server", "-b", "0.0.0.0"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  clickhouse-data:
  redis-data:
